name: CI / Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify clean SQLite Alembic migrations
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./test_ci.db

      - name: Run Backend Pytest suite
        run: |
          pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET: test_ci_jwt_secret_key_minimum_32_chars_123456
          ENVIRONMENT: test
          ENV: testing

  frontend:
    name: Frontend Lint, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npm run test:e2e
